# سیمرغ‌اواس — پایانهٔ Kitty
font_family      Fira Code
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

# پالت «شبِ فیروزه» (بر پایهٔ Catppuccin Mocha)
background            #11111b
foreground            #cdd6f4
cursor                #94e2d5
selection_background  #313244
selection_foreground  #cdd6f4

color0  #45475a
color1  #f38ba8
color2  #a6e3a1
color3  #f9e2af
color4  #89b4fa
color5  #f5c2e7
color6  #94e2d5
color7  #bac2de
color8  #585b70
color9  #f38ba8
color10 #a6e3a1
color11 #f9e2af
color12 #89b4fa
color13 #f5c2e7
color14 #94e2d5
color15 #a6adc8

background_opacity 0.92
window_padding_width 10
window_border_width 0
hide_window_decorations yes
tab_bar_edge top
shell_integration enabled

# کلیدهای کپی/پیست رایج
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
