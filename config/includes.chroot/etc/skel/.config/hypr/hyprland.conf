# ─────────────────────────────────────────────────────────────
#  SimorghOS 0.0.1 — Hyprland configuration
#  SimorghOS · Persian-first Hyprland · Debian 13
# ─────────────────────────────────────────────────────────────

source = ~/.config/hypr/theme.conf
source = ~/.config/hypr/autostart.conf
source = ~/.config/hypr/keybinds.conf

# ── ورودی: چیدمان صفحه‌کلید فارسی/انگلیسی ─────────────────
input {
    kb_layout = us,ir
    kb_variant = ,pes
    kb_options = grp:win_space_toggle,grp_led:caps
    follow_mouse = 1
    float_switch_override_focus = 2
    sensitivity = 0
    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
}

general {
    gaps_in = 6
    gaps_out = 14
    border_size = 2
    col.active_border = $accent
    col.inactive_border = $border_inactive
    layout = dwindle
    allow_tearing = false
    resize_on_border = true
}

dwindle {
    preserve_split = true
    special_scale_factor = 0.85
}

decoration {
    rounding = 14
    active_opacity = 0.97
    inactive_opacity = 0.92
    fullscreen_opacity = 1.0
    blur {
        enabled = true
        size = 6
        passes = 3
        new_optimizations = true
        vibrancy = 0.35
        ignore_opacity = true
        xray = true
    }
    shadow {
        enabled = true
        range = 30
        render_power = 3
        color = $shadow
    }
}

animations {
    enabled = true
    bezier = simorghOut, 0.05, 0.9, 0.1, 1.05
    bezier = simorghIn, 0.6, -0.28, 0.735, 0.045
    bezier = simorghSmooth, 0.25, 1, 0.5, 1
    animation = windows, 1, 4, simorghOut, popin 85%
    animation = windowsOut, 1, 3, simorghIn
    animation = border, 1, 8, default
    animation = fade, 1, 5, simorghSmooth
    animation = workspaces, 1, 4, simorghSmooth, slidevert
}

# 0.55: workspace swipe is always on; per-finger tuning removed.

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
    vrr = 1
}

binds {
    workspace_back_and_forth = true
    allow_workspace_cycles = true
}

xwayland {
    force_zero_scaling = true
}

# ── قوانین پنجره‌ها (سینتکس 0.53+) ───────────────────────────
windowrule = match:class ^(calamares)$, float on
windowrule = match:class ^(pavucontrol)$, float on
windowrule = match:class ^(nm-connection-editor)$, float on
windowrule = match:class ^(blueman-manager)$, float on
windowrule = match:title ^(Simorgh Setup)$, float on
windowrule = match:title ^(Simorgh Setup)$, size 760 560
windowrule = match:title ^(Simorgh Setup)$, center on
windowrule = match:class ^(kitty)$, opacity 0.96 0.92
windowrule = match:class ^(thunar)$, opacity 0.96 0.92

# ── لایه‌های شیشه‌ای (blur) ──────────────────────────────────
layerrule = match:namespace waybar, blur 1
layerrule = match:namespace rofi, blur 1
layerrule = match:namespace hyprlock, blur 1
layerrule = match:namespace notifications, blur 1
layerrule = match:namespace wlogout, blur 1
layerrule = match:namespace waybar, ignore_alpha 0.5
