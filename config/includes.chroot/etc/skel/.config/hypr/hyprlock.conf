# سیمرغ‌اواس — صفحهٔ قفل با تاریخ جلالی
general {
    disable_loading_bar = true
    hide_cursor = false
    grace = 5
}

background {
    path = /usr/share/backgrounds/simorgh/wallpaper-simorgh-dark.png
    blur_passes = 2
    blur_size = 8
    dim = 0.35
}

# ساعت بزرگ
label {
    monitor =
    text = cmd[update:1000] date +%H:%M
    color = rgba(cdd6f4ff)
    font_size = 72
    font_family = Vazirmatn
    position = 0, 120
    halign = center
    valign = center
}

# تاریخ جلالی
label {
    monitor =
    text = cmd[update:60000] /usr/share/simorgh/bin/simorgh-jdate --long
    color = rgba(94e2d5ff)
    font_size = 20
    font_family = Vazirmatn
    position = 0, 40
    halign = center
    valign = center
}

# پیام فارسی
label {
    monitor =
    text = سیمرغ در آشیانه است؛ برای بازگشت، گذرواژه را بنویسید
    color = rgba(a6adc8ff)
    font_size = 13
    font_family = Vazirmatn
    position = 0, -120
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 56
    outline_thickness = 2
    dots_size = 0.28
    dots_spacing = 0.2
    outer_color = rgba(94e2d5ff)
    inner_color = rgba(1e1e2eff)
    font_color = rgba(cdd6f4ff)
    fade_on_empty = false
    placeholder_text = گذرواژه…
    fail_text = گذرواژه نادرست است؛ دوباره تلاش کنید
    font_family = Vazirmatn
    position = 0, -40
    halign = center
    valign = center
}
