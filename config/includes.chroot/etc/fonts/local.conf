<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- سیمرغ‌اواس — وزیرمتن به‌عنوان قلم پیش‌فرض برای متن فارسی و لاتین -->
<fontconfig>
  <alias>
    <family>sans-serif</family>
    <prefer><family>Vazirmatn</family></prefer>
  </alias>
  <alias>
    <family>serif</family>
    <prefer><family>Vazirmatn</family></prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer>
      <family>Fira Code</family>
      <family>Vazirmatn</family>
    </prefer>
  </alias>
  <match target="pattern">
    <test qual="any" name="family"><string>Helvetica</string></test>
    <edit name="family" mode="assign" binding="same"><string>Vazirmatn</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Arial</string></test>
    <edit name="family" mode="assign" binding="same"><string>Vazirmatn</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Times</string></test>
    <edit name="family" mode="assign" binding="same"><string>Vazirmatn</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Tahoma</string></test>
    <edit name="family" mode="assign" binding="same"><string>Vazirmatn</string></edit>
  </match>
  <!-- emoji (بازِ هم‌خانواده با سبک اپل: رنگی، تخت، مدرن) -->
  <alias>
    <family>emoji</family>
    <prefer><family>Noto Color Emoji</family></prefer>
  </alias>
  <!-- رندرینگ شبیه macOS: hinting ملایم + subpixel rgba -->
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="rgba" mode="assign"><const>rgb</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>
  </match>
</fontconfig>
