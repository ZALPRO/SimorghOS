# سیمرغ‌اواس — پیکربندی نصب‌کنندهٔ Calamares
---
instances: {}

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - users
  - displaymanager
  - bootloader
  - umount
- show:
  - finished

branding: simorgh

prompt-install: false
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
hide-back-and-next-during-exec: false
quit-at-end: false
